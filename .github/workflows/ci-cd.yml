name: Orbital Singularity CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-test:
    name: Typecheck, Build & Playwright E2E Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Compile Next.js 15 production build
        run: npm run build

      - name: Execute Playwright E2E verification suite
        run: npm run test:e2e

      - name: Upload Playwright test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  deploy-vercel:
    name: Deploy to Vercel Production
    needs: [verify-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_mvV0NlN9phNSfXe4PmlcG3eK' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_SidGLdC1puWpbdhQGzYm7SAZTc2B' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Vercel Production
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Deploying production build to Vercel..."
          npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Inform token requirement if VERCEL_TOKEN missing
        if: env.VERCEL_TOKEN == ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "::notice ::Auto-deploy step skipped because secrets.VERCEL_TOKEN is not yet set in repository settings. To enable auto-deployment on push, add VERCEL_TOKEN to GitHub repository secrets."
